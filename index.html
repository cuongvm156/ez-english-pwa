<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EZ English">
<title>EZ English</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css?v=1.2">
</head>
<body>
<main class="app">
<section id="listView">
<header class="hero"><div><h1>EZ English</h1><p>Original Effortless English</p></div><span class="badge">V1.1</span></header>
<div class="panel">
<div class="row between"><strong>Lessons</strong><button id="reloadBtn" class="small">Reload</button></div>
<p id="status" class="muted">Đang tải dữ liệu...</p>
<div id="lessonList" class="lesson-list"></div>
</div>
</section>

<section id="playerView" class="hidden">
<header class="player-head">
<button id="backBtn" class="icon-btn">←</button>
<div class="title-wrap"><div id="lessonNo" class="muted small-text"></div><h2 id="lessonTitle">Lesson</h2></div>
</header>

<div class="tabs">
<button class="tab active" data-tab="main">Main Story</button>
<button class="tab" data-tab="vocab">Vocabulary</button>
<button class="tab" data-tab="mini">Mini Story</button>
</div>

<section class="panel transcript-panel"><h3>Transcript</h3><div id="transcript" class="transcript"></div></section>

<section class="panel sticky-player">
<div class="row between"><strong id="modeLabel">Main Story</strong><span id="audioStatus" class="muted small-text">Ready</span></div>
<audio id="audio" controls preload="metadata"></audio>
<div class="quick-controls"><button id="rewindBtn">↶ 10s</button><button id="forwardBtn">10s ↷</button></div>

<div class="playback-mode">
<label for="playbackMode">Playback Mode</label>
<select id="playbackMode">
<option value="once">Once</option>
<option value="repeat-one">Repeat One</option>
<option value="repeat-3">Repeat 3x</option>
<option value="lesson-loop">Lesson Loop</option>
</select>
<span id="repeatInfo" class="muted small-text"></span>
</div>
</section>
</section>
</main>
<script src="./app.js?v=1.2"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js?v=1.2');
      await reg.update();
    } catch (e) {
      console.warn('Service Worker update failed', e);
    }
  });
}
</script>
</body>
</html>
